name: Auto-sync

# **THIS FILE IS NOT THIS REPOSITORY'S WORKFLOW. It is the entire content of
# `kartaan-com/kartaan-pipeline-template`** -- the small public template a seller
# presses "Use this template" on to make their own PRIVATE `kartaan-pipeline`
# repository, which is where their Amazon and Google secrets are written.
#
# **GITHUB DOES NOT RUN IT FROM HERE.** GitHub reads workflows only from
# `.github/workflows/` at the ROOT of a repository. This one is four levels down,
# so it is text in this repository and a workflow only in the seller's.
#
# **IT IS KEPT HERE BECAUSE THE THING IT CALLS IS HERE.** The eight secret names
# and the tag are written in two files; when they were written in two
# repositories with nothing joining them, that is the exact shape this project
# has paid for again and again. `autosync/nightly_checks.py` reads this file and
# the one in `.github/workflows/` and refuses if they ever disagree.
#
# **IT HOLDS NO FETCHING CODE, AND THAT IS D121.** A copy of the code is frozen
# the day it is made: a fix pushed here would never reach it. So this says
# `uses:` and the code comes from Kartaan every night.
#
# **AND IT NAMES A VERSION TAG, NEVER A BRANCH -- D122.** A seller pinned to a
# branch gets whatever was pushed that afternoon, and one bad push breaks every
# seller that night. A three-part tag never moves.
#
# **WHAT A SELLER'S FROZEN COPY OF THIS FILE CANNOT PICK UP** is a change to the
# CALLER: a ninth secret, or a newer tag. That is real, it is not solved here,
# and it is why the tag below is changed deliberately and rarely.

# **WHAT THIS JOB MAY DO TO THE SELLER'S OWN REPOSITORY: NOTHING (D135).** Left
# unsaid, `GITHUB_TOKEN` takes the repository's default, which on many accounts
# is `contents: write` -- so a fetching job that only ever reads files and writes
# to Google could rewrite the seller's own workflow, and so change what their own
# secrets are handed to. `contents: read` is what `actions/checkout` needs and is
# all it needs, and the called workflow narrows it to the same thing again.
permissions:
  contents: read

on:
  # **THIS LINE IS THE ONLY THING THAT WAKES A SELLER'S FETCHING, AND NOTHING
  # REWRITES IT.** Nothing Kartaan holds may rewrite a seller's workflow (D113):
  # anything that can write a workflow can write one that carries their secrets
  # away. **THE SAME LINE IS IN `Kartaan-AutoSync/.github/workflows/autosync.yml`
  # AND `autosync/nightly_checks.py` REFUSES IF THE TWO EVER DISAGREE**, because
  # one of them moving alone is a seller woken at an hour nothing else expects.
  #
  # **UTC. 10:30 UTC is 16:00 the same day in his time** -- four in the afternoon,
  # which is `clock.THE_ONE_TICK_HOUR` and also `clock.NOT_BEFORE_HOUR`, the
  # default for a seller who has not chosen. :30 rather than :00 because GitHub's
  # own documentation names the start of the hour as when a scheduled run is most
  # likely to be delayed; it lands on the top of HIS hour so that a seller who
  # chose four is not refused by a tick a few minutes before it.
  #
  # **HIS DECISION, 2026-09-10.** This was 02:23 in his morning, and the hour a
  # seller chooses is a FLOOR rather than an appointment -- so twenty-one of the
  # twenty-four hours a seller could choose fetched nothing, on any day.
  #
  # **STILL TRUE, AND NOW SAID OUT LOUD RATHER THAN LEFT SILENT: one tick a day
  # and the chosen hour is a FLOOR.** A seller who chooses 17:00 to 23:00 is above
  # the only tick there is, and `clock.why_the_hour_is_no_good` now refuses that
  # setting in words instead of failing quietly every night.
  schedule:
    - cron: '30 10 * * *'

  # **STARTABLE BY HAND**, which is what makes a first run, and any morning
  # something looks wrong, possible without waiting for a tick.
  workflow_dispatch:
    inputs:
      even_if_not_due:
        description: 'Run even if one already ran in the last 24 hours'
        type: boolean
        default: false

# **NO `concurrency:` HERE, DELIBERATELY.** The called workflow already carries
# `group: autosync`, and a group evaluated in this repository is this
# repository's. From GitHub's own documentation, a job and its workflow sharing
# one concurrency group deadlock -- the job waits for the run it is part of, and
# is cancelled saying so. So the guard lives on one side only, and it is the side
# that comes from Kartaan.

jobs:
  fetch:
    # **THE TAG IS THE WHOLE OF D122.** Three parts, never a branch, never a
    # moving `v0`. Changing it is a deliberate act by the seller or by whoever
    # sets their repository up -- it is the only line here that decides which
    # code runs tonight.
    #
    # **v0.1.0 IS BURNT AND MUST NEVER BE HANDED TO A SELLER (A41).** At that
    # tag the called workflow fetched the CALLER's repository -- this one,
    # which holds only this file -- and then looked for an `autosync` folder
    # in it. Every night would have failed inside a run. `v0.1.1` is the
    # first tag a seller can actually fetch on.
    uses: kartaan-com/Kartaan-AutoSync/.github/workflows/autosync.yml@v0.1.1
    with:
      # **`|| false` IS NOT DECORATION.** On a scheduled tick the `inputs`
      # context has nothing in it, and an empty value handed to a boolean input
      # is not a boolean. GitHub's own documented behaviour for `||` is to return
      # the first value that is not falsy, and an empty one is falsy -- so a tick
      # passes `false` and the button passes what was ticked.
      even_if_not_due: ${{ inputs.even_if_not_due || false }}
    # **EACH ONE BY NAME, AND `inherit` IS NOT AVAILABLE.** From GitHub's own
    # documentation, `secrets: inherit` works only for a called workflow in the
    # same organisation or enterprise. A seller's GitHub is a personal account,
    # which is neither.
    #
    # **A NAME WHOSE SECRET IS NOT SET PASSES AN EMPTY STRING AND GITHUB IS
    # SATISFIED.** What catches that is the called workflow's own "Is this
    # repository set up to fetch?" step, which says so in words and exits clean
    # rather than red.
    secrets:
      AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
      AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
      AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
