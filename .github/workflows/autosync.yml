name: Auto-sync

# **THE THING THAT SETS AUTO-SYNC OFF WITH NOBODY PRESENT.** Everything it calls
# already existed; this is what wakes it up. D36 settled where -- the seller's own
# GitHub Actions -- and D100 settled which half runs here: **Amazon only.** Meesho
# has no published API and Akamai in front of it, so Meesho runs in the seller's
# own Chrome through the extension (D107), and a job here that tried it would fail
# on twenty-one reports every night.
#
# **IT IS NEVER A SELLER'S JOB.** A seller signs in to Google and installs the
# extension, and that is all. This file and its secrets are put in place for them
# at onboarding (D36). It is manual today only because that part is not built.
#
# **WHERE THE CREDENTIALS GO, and they never pass through code or a session:**
# Settings -> Secrets and variables -> Actions -> New repository secret, on the
# seller's own repository. They are named one per line in the `env` block below,
# and nowhere is the number written down -- a hand-typed count is wrong from the
# moment the next one lands. Golden Rule 8: they live there and nowhere else --
# not in a file, not in this workflow, not in a message.

# **WHAT THIS JOB IS ALLOWED TO DO TO THE SELLER'S REPOSITORY: NOTHING (D135).**
#
# Left unsaid, `GITHUB_TOKEN` takes the repository's default, which on most
# repositories is `contents: write` -- so a fetching job that only ever reads
# files and writes to Google could rewrite the seller's own code, including this
# workflow and therefore what their secrets are handed to. **That is exactly the
# permission D113 refused to give Kartaan's server, granted by accident to a job
# running on a machine nobody is watching.**
#
# `contents: read` is what `actions/checkout` needs and is all it needs. Written
# out rather than left to a default, because a default is a setting somebody
# else can change (D135's second rule: the narrowest permission that works, and
# the wider one refused in writing).
permissions:
  contents: read

on:
  # **ONCE A DAY, AT THE HOUR THE SELLER CHOSE (D120).**
  #
  # It used to wake every hour and let the clock refuse twenty-three of them.
  # His decision, and he was right: there is no new data every hour, and the cost
  # was not what D113 said. **GitHub bills every job rounded UP to a whole
  # minute**, so twenty-four ten-second refusals cost twenty-four minutes a day,
  # not four -- about 720 of the free 2,000 a month, for nothing.
  #
  # **THE HOUR IS WRITTEN INTO THIS LINE WHEN THE WORKFLOW IS PUT IN THE SELLER'S
  # REPOSITORY AT ONBOARDING**, and never afterwards. Changing it later is a
  # one-off the seller triggers -- **never standing permission for Kartaan to
  # write files in their repository**, which is the thing D113 was right to
  # refuse: anything that can write a workflow can write one that carries their
  # secrets away.
  #
  # **THE CLOCK DECIDES WHETHER A TICK RUNS. IT CANNOT MAKE ONE HAPPEN, AND THIS
  # COMMENT USED TO SAY IT COULD.**
  #
  # What stood here said "a workflow whose line was never rewritten still fetches
  # at the hour the seller can see rather than at the one written here". **That
  # is false, and it is the sentence that hid the fault below.** The cron line is
  # the ONLY thing that wakes this job. `clock.why_not_now` can refuse a tick; it
  # has nothing to start one with.
  #
  # **SO WITH ONE TICK A DAY AND NOBODY REWRITING THIS LINE, A SELLER WHO CHOSE
  # ANY HOUR FROM 3 TO 23 NEVER FETCHES, ON ANY DAY.** The chosen hour is a FLOOR
  # -- "not before eight" -- and the one tick arrives at 02:23 in his time, which
  # is before every one of them. Driven against `clock.why_not_now`, hour by
  # hour: 0, 1 and 2 fetch; the other twenty-one never do, and the seller is told
  # only "It is 02:23 and fetching is set for 11:00 or later", which reads
  # exactly like a tick that will succeed later today. There is no later tick
  # today. `autosync/nightly_checks.py` pins this, so the day it is repaired the
  # check has to be changed on purpose.
  #
  # **WHY IT IS NOT REPAIRED IN THIS LINE.** The three ways out are all his to
  # choose and none is a line of YAML: wake every hour again (reverses D120 and
  # costs about 720 of the free 2,000 minutes a month); build the onboarding step
  # that writes his hour in here (the thing this file already says happens and
  # which does not exist); or let something rewrite the workflow (D113 refused
  # standing write permission on a seller's repository, and was right --
  # anything that can write a workflow can write one that carries their secrets
  # away). It is written up as its own piece in `tools/work.json`.
  #
  # **UTC, deliberately, and not the timezone field GitHub now offers.** That
  # field is in public preview, and a seller's data arriving depends on it.
  # India's clock lives in `clock.py`, said out loud, where it is checked --
  # `HOURS_AHEAD_OF_UTC = 5`, `MINUTES_AHEAD_OF_UTC = 30`. One clock, in the file
  # that can prove it. **20:53 UTC is 02:23 the next morning in his time**, which
  # is `clock.NOT_BEFORE_HOUR` -- the default for a seller who has not chosen.
  #
  # **:53 RATHER THAN :00** because GitHub's own documentation names the start of
  # the hour as when a scheduled run is most likely to be delayed.
  schedule:
    - cron: '53 20 * * *'

  # **STARTABLE BY HAND**, which is what makes a first run, and any morning
  # something looks wrong, possible without waiting for a tick.
  workflow_dispatch:
    inputs:
      even_if_not_due:
        description: 'Run even if one already ran in the last 24 hours'
        type: boolean
        default: false

  # **AND THE TRIGGER THAT LETS EVERY SELLER'S OWN GITHUB RUN THIS WITHOUT
  # HOLDING A COPY OF IT (D121, D122).**
  #
  # His words in D121: *"a public repository, from where every seller's GitHub
  # action can source the code. And if we push something, it is going to be
  # available for everyone immediately."* Until this block existed no other
  # repository could call this file at all, so the only way a seller could run
  # the fetching was to hold a COPY -- and a copy is frozen the day it is made,
  # which is the one thing D121 exists to prevent.
  #
  # **THE SELLER'S OWN FILE IS A CALLER AND NOTHING ELSE.** It sits in their
  # `kartaan-pipeline` repository, carries the schedule and the button, and says
  # `uses:` this file **at a version tag** (D122) -- never at a branch, so one
  # bad push here does not break every seller that night. What that file says is
  # kept in this repository at
  # `pipeline-template/.github/workflows/autosync.yml`, because a change to the
  # eight names or to the tag is a change to both files.
  #
  # **EVERY SECRET IS DECLARED AND PASSED BY NAME. `inherit` IS NOT AVAILABLE.**
  # From GitHub's own documentation, `secrets: inherit` works only for a called
  # workflow in the same organisation or enterprise, and a seller's GitHub is a
  # personal account, which is neither.
  #
  # **`required: true` MEANS "THE CALLER MUST NAME IT", NOT "IT MUST HAVE A
  # VALUE".** A caller that writes `${{ secrets.AMAZON_CLIENT_ID }}` when that
  # secret is not set hands over an empty string, and GitHub is satisfied. So it
  # catches a seller whose workflow forgot a name, and it CANNOT catch a seller
  # whose secret was never set -- which is the whole reason the "Is this
  # repository set up to fetch?" step below still asks, and still has to.
  #
  # **THESE EIGHT NAMES ARE THE SAME EIGHT AS THE GATE AND THE `env` BLOCK, AND
  # NOTHING HERE COUNTS THEM.** `autosync/nightly_checks.py` holds all of the
  # lists to each other in every direction (D190) -- this one, the gate, the
  # `env` block, `start.py`'s own asking, and the caller next door. A ninth
  # secret that reaches four of the five is red, rather than a night that starts
  # and then cannot read what it needs.
  workflow_call:
    inputs:
      # **THE SAME BUTTON, AND WITHOUT THIS IT WOULD REACH NOBODY.** The seller's
      # caller is the only place this button is ever pressed -- this repository
      # has no secrets and takes the no-platform branch -- so leaving it
      # undeclared would quietly end the "something looks wrong this morning, run
      # it again" case for every seller. `false` when nothing passes it, which is
      # what a scheduled tick does.
      even_if_not_due:
        description: 'Run even if one already ran in the last 24 hours'
        type: boolean
        required: false
        default: false
    secrets:
      AMAZON_CLIENT_ID:
        required: true
      AMAZON_CLIENT_SECRET:
        required: true
      AMAZON_REFRESH_TOKEN:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      GOOGLE_REFRESH_TOKEN:
        required: true
      DRIVE_FOLDER_ID:
        required: true
      FIREBASE_PROJECT_ID:
        required: true

# **TWO RUNS AT ONCE FETCH EVERY FILE TWICE**, into two differently-named copies --
# the fault that put three wrongly-dated files into the reference's Drive. The
# clock already refuses a second run; this is the belt to its braces, because the
# clock reads a record and this reads GitHub itself.
#
# **NOT `cancel-in-progress`.** Killing a run halfway is exactly how the reference
# lost four runs in twenty-six days. A second one waits, and by the time it starts
# the clock will tell it there is nothing to do.
concurrency:
  group: autosync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # A run that has gone wrong should not sit there burning the seller's free
    # minutes until GitHub's own six-hour ceiling.
    #
    # **AN HOUR, AND `clock.GONE_AFTER` IS FOUR -- SO FOR THREE HOURS THE RECORD
    # SAYS A RUN IS STILL GOING WHEN GITHUB HAS ALREADY STOPPED IT.** That is
    # deliberate and it is the safe direction: nothing starts a second run in
    # those three hours, and a run killed at sixty minutes had already stopped
    # doing anything useful. Said here because an earlier version of this comment
    # claimed the two "never disagree", which is not true and never was.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # **NOTHING IS INSTALLED.** The whole of `autosync/` is written on what
      # Python itself provides. A seller's nightly job that pulled packages from
      # the internet would be a job that fails the day one of them moves, and a
      # supply chain nobody here is watching.
      - name: Nothing to install
        run: python -c "import sys; print(sys.version)"

      # **IS THIS REPOSITORY SET UP TO FETCH AT ALL?**
      #
      # This same workflow sits in Kartaan's own repository, where none of these
      # secrets exist and none should. Without this, it would go red every three
      # hours for ever, and a red tick that always means nothing is a red tick
      # nobody looks at on the day it means something (D108).
      #
      # `secrets` cannot be read in an `if:` -- GitHub's own documentation -- so
      # it is read where it is allowed, a step's `env`, and answered as an output.
      # **The values are never printed; only whether they are there.**
      - name: Is this repository set up to fetch?
        id: setup
        env:
          READY: >-
            ${{ secrets.AMAZON_CLIENT_ID != ''
             && secrets.AMAZON_CLIENT_SECRET != ''
             && secrets.AMAZON_REFRESH_TOKEN != ''
             && secrets.GOOGLE_CLIENT_ID != ''
             && secrets.GOOGLE_CLIENT_SECRET != ''
             && secrets.GOOGLE_REFRESH_TOKEN != ''
             && secrets.DRIVE_FOLDER_ID != ''
             && secrets.FIREBASE_PROJECT_ID != '' }}
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "::notice::No platform is connected on this repository, so there is nothing to fetch."
            echo "::notice::Auto-sync runs on the seller's own repository, where its secrets are set."
          fi

      - name: Fetch whatever is owed
        if: steps.setup.outputs.ready == 'true'
        working-directory: autosync
        env:
          # **THESE VALUES ONLY EVER EXIST HERE.** They are read
          # once by `start.main`, handed straight to the door they belong to,
          # and never written to the log, the run's record or an error message.
          #
          # Amazon: from the seller's own Login with Amazon application, created
          # when they registered as a private developer (D83).
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          # Google: the seller's own account, asked only for `drive.file`, which
          # reaches nothing this app did not itself create.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Not secret, and kept beside the rest so there is one place to look:
          # the id of the one folder in the seller's Drive that Kartaan was given.
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          # **WHICH DATABASE THE RUN'S RECORDS GO INTO (D114, widened by D136).**
          # The seller's own
          # Firebase project. Not a credential either -- it names a project and
          # grants nothing; what grants anything is the Google permission above,
          # which the seller gave and which now covers their own database too.
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # Only ever true because somebody pressed the button -- the one here,
          # or the one on the seller's own caller, which passes it through. A
          # scheduled tick sends nothing and a caller that passes nothing sends
          # `false`; neither is the word "true", so the clock decides.
          EVEN_IF_NOT_DUE: ${{ inputs.even_if_not_due }}
          #
          # **THE HOUR THE SELLER CHOSE IS NOT HERE, and that is D114.** It used
          # to be a secret nobody set. It is now READ, every run, off the business
          # record in the seller's own database -- where the This business tab
          # writes it (D113). A setting with two homes is a setting that
          # disagrees with itself, and the one the seller can see has to win.
        # **RED MEANS OUR OWN DEFECT, NOT A REPORT FAILING (D108).** A report
        # Amazon would not give up is written to the log, put on the board and
        # raised as an alarm, and the job did its work. `start.main` returns 1
        # only when the run could not read its own record, could not save it, or
        # could not get its evidence out of the building.
        run: python start.py

      # **THE PACKAGE'S OWN CHECKS RUN HERE TOO.**
      #
      # Not because a scheduled run changes the code -- it cannot -- but because
      # this is the one job that runs in the seller's repository, on a machine
      # nobody is watching. If the code that arrives there is broken, this is
      # where it is found, and it is found before anybody notices data stopped
      # arriving.
      #
      # **ONLY WHEN THERE IS SOMETHING TO FETCH.** On a repository with no
      # secrets there is nothing for these checks to be about, and a red tick
      # that always means nothing is a red tick nobody reads on the day it means
      # something (D108).
      - name: The package's own checks
        if: steps.setup.outputs.ready == 'true'
        working-directory: autosync
        run: |
          COUNT=0
          for CHECK in *_checks.py; do
            echo "--- $CHECK"
            python "$CHECK"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no checks files were found at all -- the checks are not running"
            exit 1
          fi
          echo "$COUNT checks files ran"
